# This workflow is managed by gh actions-lock.

name: Weekly NPM Update

on:
  schedule:
    - cron: '0 9 * * 1'
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-update
  cancel-in-progress: true

jobs:
  npm-update:
    env:
      pr_title: '[Automated] Update NPM dependencies'
      # lockfile の生成に使う npm。.node-version(24.12.0)同梱の npm 11.6.2 は、optional な依存に連なる peer
      # (markuplint 経由の eslint など)を lockfile から落として書き出し、npm ci の検証に通らなくなる
      # (npm 11.12.1 以降では起きないことを確認済み)。生成だけ新しい npm で行い、検証(Verify lockfile)は
      # .node-version の npm で行う。新しい npm が生成した lockfile は、npm 11.6.2・11.12.1・11.17.0・11.19.0・
      # 11.21.0 の npm ci で通ることを確認済みである。
      # 逆に、11.6.2 時代の lockfile は 11.12.1 以降の npm ci に通らない(@emnapi/runtime などが lockfile に無い)。
      # そのため .node-version を 24.15 以降へ上げるのは、この workflow が作る PR で lockfile を再生成して
      # マージした後にする。上げ終えたら、この指定と各 npx を外して npm に戻す。
      lockfile_npm: 'npm@11.21.0'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # PR の base(develop)と同じブランチを常に取得する。schedule は既定で master を取得するため、
          # 指定しないと master の lockfile を更新して develop へ rebase することになる
          # (create-pull-request は base と一貫したチェックアウトを前提にしている)。
          ref: develop
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            package.json
            package-lock.json
            .node-version

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Check existing PR
        id: check-pr
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          pr_number=$(gh pr list --head automated-npm-update --base develop --state open --json number --jq '.[0].number // empty')
          if [[ -n "$pr_number" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get changed files
        id: changed-files
        run: |
          current_branch=${GITHUB_REF#refs/heads/}
          default_branch=${{ github.event.repository.default_branch }}

          # 監視対象ファイルリスト
          files_to_check=("package.json" "package-lock.json")
          any_changed=false

          # 各ファイルの変更を検知
          for file in "${files_to_check[@]}"; do
            if git diff --name-only "origin/${default_branch}...${current_branch}" | grep -Fxq "$file"; then
              echo "${file//-/_}_changed=true" >> "$GITHUB_OUTPUT"
              any_changed=true
            else
              echo "${file//-/_}_changed=false" >> "$GITHUB_OUTPUT"
            fi
          done

          # いずれかのファイルが変更された場合のフラグ
          echo "any_changed=$any_changed" >> "$GITHUB_OUTPUT"

      - name: Decide whether to update
        id: should-update
        env:
          ANY_CHANGED: ${{ steps.changed-files.outputs.any_changed }}
          PR_EXISTS: ${{ steps.check-pr.outputs.exists }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$ANY_CHANGED" == "true" || "$PR_EXISTS" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize lockfile
        if: steps.should-update.outputs.run == 'true'
        run: npx --yes "$lockfile_npm" install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Update packages
        if: steps.should-update.outputs.run == 'true'
        run: npx --yes "$lockfile_npm" update --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Normalize lockfile
        if: steps.should-update.outputs.run == 'true'
        run: npx --yes "$lockfile_npm" install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile
        if: steps.should-update.outputs.run == 'true'
        run: npm ci --ignore-scripts --dry-run --no-audit --no-fund

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: ${{ steps.git-check.outputs.changes == 'true' }}
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          token: ${{ secrets.BOT_TOKEN }}
          base: develop
          add-paths: package-lock.json
          commit-message: Update npm dependencies
          title: ${{ env.pr_title }}
          body: 'Automated changes by GitHub Actions'
          branch: automated-npm-update
          delete-branch: true

      - name: Close PR if no changes remain
        if: ${{ steps.should-update.outputs.run == 'true' && steps.git-check.outputs.changes != 'true' && steps.check-pr.outputs.exists == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          PR_NUMBER: ${{ steps.check-pr.outputs.number }}
        run: |
          gh pr close "$PR_NUMBER" --delete-branch --comment "developブランチへの取り込み完了により差分が解消したため、自動クローズします。"
