# This workflow is managed by gh actions-lock.

name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    runs-on: ubuntu-slim
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 10

    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate auto-merge conditions
        id: evaluate
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEP_TYPE: ${{ steps.metadata.outputs.dependency-type }}
        run: |
          echo "ecosystem=$ECOSYSTEM update_type=$UPDATE_TYPE dep_type=$DEP_TYPE"

          SHOULD_MERGE=false

          # GitHub Actions: patch or minor (major は破壊的変更を含みうるため手動で確認する)
          if [[ "$ECOSYSTEM" == "github_actions" ]]; then
            if [[ "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
              SHOULD_MERGE=true
              echo "→ GitHub Actions $UPDATE_TYPE: auto-merge"
            fi

          # npm devDependencies: patch or minor
          elif [[ "$DEP_TYPE" == "direct:development" ]]; then
            if [[ "$UPDATE_TYPE" == "version-update:semver-patch" || "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
              SHOULD_MERGE=true
              echo "→ devDependency $UPDATE_TYPE: auto-merge"
            fi

          # npm production dependencies: patch only
          elif [[ "$DEP_TYPE" == "direct:production" ]]; then
            if [[ "$UPDATE_TYPE" == "version-update:semver-patch" ]]; then
              SHOULD_MERGE=true
              echo "→ production dependency patch: auto-merge"
            fi
          fi

          if [[ "$SHOULD_MERGE" == "false" ]]; then
            echo "→ Conditions not met: skip auto-merge"
          fi

          echo "should_merge=$SHOULD_MERGE" >> "$GITHUB_OUTPUT"

      # マージの条件(必須チェック)は develop の ruleset が持つ。ここでは auto-merge を有効にするだけで、
      # 必須チェックがすべて成功した時点で GitHub がマージする(チェックの完了をワークフロー側で待たない)。
      - name: Enable auto-merge
        if: steps.evaluate.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR_URL"
